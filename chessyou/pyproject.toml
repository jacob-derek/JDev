[project]
name = "chessyou"
version = "0.1.0"
description = "ChessYou!: analisador de partidas de xadrez para o terminal"
requires-python = ">=3.10"
dependencies = ["textual>=0.80", "chess>=1.10"]

[project.scripts]
chessyou = "chessyou.app:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E701"]
